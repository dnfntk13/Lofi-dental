<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#000000" />
    <title>lofi | Logo Display</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000000;
      }
      #displayLogo {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }
    </style>
  </head>
  <body data-display="logo">
    <img id="displayLogo" src="/assets/lofi-logo-violet.png" alt="lofi esthetic dentistry" draggable="false" />
  </body>
</html>
