<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f6f3fc" />
    <title>lofi | Logo Display</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #f6f3fc;
      }
      img {
        display: block;
        width: min(78vw, 92vh);
        height: auto;
        max-width: 100%;
        max-height: 76vh;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }
      @supports (height: 100dvh) {
        body { height: 100dvh; }
        img { width: min(78vw, 92dvh); max-height: 76dvh; }
      }
    </style>
  </head>
  <body data-display="logo">
    <img src="/assets/lofi-logo-violet.png" alt="lofi esthetic dentistry" draggable="false" />
  </body>
</html>
