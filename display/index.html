<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>lofi esthetic dentistry | Clinic Display</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000000;
      }

      #displayVideo {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000000;
        object-fit: contain;
      }

      #displayLogo {
        position: absolute;
        top: 42px;
        left: 52px;
        z-index: 2;
        width: 240px;
        height: auto;
        border: 0;
      }

      #displayClock {
        position: absolute;
        top: 46px;
        right: 52px;
        z-index: 2;
        margin: 0;
        color: #7657dc;
        font-family: "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
        font-size: 32px;
        font-weight: bold;
        letter-spacing: 1px;
        text-shadow: 0 2px 6px #000000;
      }
    </style>
  </head>
  <body>
    <video
      id="displayVideo"
      autoplay="autoplay"
      muted="muted"
      playsinline="playsinline"
      webkit-playsinline="webkit-playsinline"
      preload="auto"
    >
      <source src="/assets/lofi%20veneer%20videos/nojima-before-after.mp4" type="video/mp4" />
    </video>
    <img id="displayLogo" src="/assets/lofi-logo-violet.png" alt="lofi esthetic dentistry" />
    <p id="displayClock"></p>

    <script type="text/javascript">
      (function () {
        var video = document.getElementById("displayVideo");
        var clock = document.getElementById("displayClock");
        var playlist = [
          "/assets/lofi%20veneer%20videos/nojima-before-after.mp4",
          "/assets/display-videos/angelica-before-after.mp4",
          "/assets/lofi%20veneer%20videos/lofi-lab-dentistryisart.mp4",
          "/assets/lofi%20veneer%20videos/lofi-lab-primemill.mp4",
          "/assets/lofi%20veneer%20videos/Hongkong%20patient.mp4"
        ];
        var current = 0;
        var changing = false;

        function twoDigits(number) {
          return number < 10 ? "0" + number : String(number);
        }

        function updateClock() {
          var now = new Date();
          var koreaTime = new Date(now.getTime() + (9 * 60 * 60 * 1000));
          clock.innerHTML = twoDigits(koreaTime.getUTCHours()) + ":" + twoDigits(koreaTime.getUTCMinutes());
        }

        function playVideo() {
          video.muted = true;
          video.volume = 0;
          video.src = playlist[current];
          try {
            video.play();
          } catch (ignore) {}
        }

        function nextVideo() {
          if (changing) {
            return;
          }
          changing = true;
          current = (current + 1) % playlist.length;
          window.setTimeout(function () {
            changing = false;
            playVideo();
          }, 500);
        }

        video.onended = nextVideo;
        video.onerror = nextVideo;
        video.muted = true;
        video.volume = 0;

        window.setInterval(function () {
          if (video.paused && !video.ended && video.readyState > 1) {
            try {
              video.play();
            } catch (ignore) {}
          }
        }, 5000);

        updateClock();
        window.setInterval(updateClock, 30000);

        try {
          video.play();
        } catch (ignore) {}
      }());
    </script>
  </body>
</html>
