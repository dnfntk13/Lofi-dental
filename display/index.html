<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f0edfb" />
  <title>lofi esthetic dentistry | Clinic Display</title>
  <link rel="stylesheet" href="/display/display.css" />
</head>
<body data-display="video">
  <header class="display-header">
    <img class="display-logo" src="/assets/lofi-logo-violet.png" alt="lofi esthetic dentistry" />
    <div class="display-time"><time id="displayClock" aria-label="Current time in Korea"></time><span id="displayDate"></span></div>
  </header>
  <main class="display-stage" aria-label="Lofi dentistry videos">
    <div id="displayStandby" class="display-standby"><img src="/assets/lofi-logo-violet.png" alt="lofi esthetic dentistry" /></div>
    <video id="displayVideo" class="display-video" muted playsinline webkit-playsinline preload="auto" aria-label="Signage video" disablepictureinpicture></video>
    <video id="displayVideoNext" class="display-video" muted playsinline webkit-playsinline preload="auto" aria-label="Next signage video" disablepictureinpicture></video>
  </main>
<script src="/display/media-cache.js"></script>
<script src="/display/player.js"></script>
  <script src="/display/display.js"></script>
</body>
</html>
