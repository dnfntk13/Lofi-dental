<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lofi veneer videos | lofi esthetic dentistry</title>
    <style>
      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      .video-repertoire {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #000;
      }

      .video-repertoire video {
        width: 100vw;
        height: 100vh;
        display: block;
        object-fit: contain;
        background: #000;
      }
    </style>
  </head>
  <body>
    <main class="video-repertoire" aria-label="lofi veneer video repertoire">
      <video id="veneerReel" autoplay muted playsinline preload="auto">
        <source src="/assets/lofi veneer videos/nojima-before-after.mp4" type="video/mp4" />
      </video>
    </main>

    <script>
      const veneerReel = document.getElementById("veneerReel");
      const veneerPlaylist = [
        "/assets/lofi veneer videos/nojima-before-after.mp4",
        "/assets/lofi veneer videos/angelica-before-after.mp4",
        "/assets/lofi veneer videos/lofi-lab-dentistryisart.mp4",
        "/assets/lofi veneer videos/lofi-lab-primemill.mp4",
        "/assets/lofi veneer videos/Hongkong patient.mp4",
      ];
      let veneerIndex = 0;

      function playCurrentVideo() {
        veneerReel.src = veneerPlaylist[veneerIndex];
        veneerReel.load();
        veneerReel.play().catch(() => {});
      }

      veneerReel.addEventListener("ended", () => {
        veneerIndex = (veneerIndex + 1) % veneerPlaylist.length;
        playCurrentVideo();
      });

      veneerReel.addEventListener("error", () => {
        veneerIndex = (veneerIndex + 1) % veneerPlaylist.length;
        playCurrentVideo();
      });
    </script>
  </body>
</html>
