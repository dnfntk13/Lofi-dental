<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meet Dr. Ryan Kim | lofi esthetic dentistry</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000000;
      }

      #drKimVideo {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000000;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <video
      id="drKimVideo"
      autoplay="autoplay"
      muted="muted"
      loop="loop"
      playsinline="playsinline"
      webkit-playsinline="webkit-playsinline"
      preload="auto"
    >
      <source src="/assets/story/meet-dr-kim.mp4" type="video/mp4" />
    </video>

    <script type="text/javascript">
      (function () {
        var video = document.getElementById("drKimVideo");
        video.muted = true;
        video.volume = 0;

        window.setInterval(function () {
          if (video.paused) {
            try {
              video.play();
            } catch (ignore) {}
          }
        }, 5000);

        try {
          video.play();
        } catch (ignore) {}
      }());
    </script>
  </body>
</html>
