<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZKDLXLXDRE"></script>
    <script>

    <title>Before & After | lofi esthetic dentistry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "Paperlogy";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Paperlogy";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Paperlogy";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      :root {
        color-scheme: light;
        --bg-cream: #f5f7ff;
        --bg-mist: #e7edff;
        --logo-ink: #1f2d66;
        --ink: #1f2d66;
        --soft-ink: #5a6fda;
        --line: rgba(90, 111, 218, 0.22);
        --card: rgba(255, 255, 255, 0.86);
        --accent: #5a6fda;
        --amber: #cdd7ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Paperlogy", "Nunito Sans", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 8%, rgba(90, 111, 218, 0.18), transparent 42%),
          radial-gradient(circle at 88% 14%, rgba(103, 128, 245, 0.2), transparent 46%),
          linear-gradient(180deg, #f8faff 0%, var(--bg-cream) 48%, var(--bg-mist) 100%);
        background-attachment: fixed;
      }

      .page {
        width: min(1180px, 92vw);
        margin: 0 auto;
        padding: 30px 0 92px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 18px;
        flex-wrap: wrap;
        padding-bottom: 22px;
      }

      .logo-link {
        display: inline-block;
        color: inherit;
        text-decoration: none;
        line-height: 0;
      }

      .logo-img {
        max-width: 194px;
        height: auto;
        display: block;
        margin-left: 4px;
      }

      .nav-back {
        margin-left: auto;
        display: flex;
        align-items: center;
      }

      .nav-back a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.52);
        backdrop-filter: blur(12px);
        text-decoration: none;
        color: var(--ink);
        box-shadow: 0 8px 24px rgba(31, 45, 102, 0.05);
        transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
      }

      .nav-back svg {
        width: 22px;
        height: 22px;
        display: block;
        stroke-width: 1.9;
      }

      .nav-back a:hover {
        transform: translateX(-2px);
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 10px 28px rgba(31, 45, 102, 0.1);
      }

      main {
        margin-top: 38px;
      }

      .page-intro {
        width: min(920px, 100%);
        margin: 0 auto 44px;
        text-align: center;
      }

      .page-title {
        margin: 0;
        color: var(--ink);
        font-size: clamp(2rem, 4vw, 3.55rem);
        font-weight: 500;
        letter-spacing: -0.045em;
        line-height: 1.13;
      }

      .page-description {
        max-width: 590px;
        margin: 17px auto 0;
        color: rgba(31, 45, 102, 0.62);
        font-size: clamp(0.92rem, 1.4vw, 1.04rem);
        line-height: 1.75;
      }

      .case-grid {
        display: grid;
        gap: 34px;
        counter-reset: case;
      }

      .case-card {
        width: 100%;
        margin: 0 auto;
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.88);
        border-radius: 26px;
        background: var(--card);
        box-shadow: 0 24px 60px rgba(31, 45, 102, 0.08), 0 2px 8px rgba(31, 45, 102, 0.04);
        backdrop-filter: blur(16px);
        counter-increment: case;
        transition: transform 240ms ease, box-shadow 240ms ease;
      }

      .case-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 30px 72px rgba(31, 45, 102, 0.11), 0 3px 10px rgba(31, 45, 102, 0.05);
      }

      .case-card-compare {
        width: min(94%, 960px);
        padding: 10px;
      }

      .case-card img {
        width: 100%;
        height: auto;
        display: block;
      }

      .case-card-featured {
        width: 100%;
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 68%) minmax(240px, 32%);
        align-items: center;
      }

      .case-card-featured img {
        height: 100%;
        object-fit: cover;
      }

      .before-after-compare {
        position: relative;
        width: 100%;
        overflow: hidden;
        border-radius: 18px;
        background: linear-gradient(135deg, #eff3ff 0%, #dfe8ff 100%);
        cursor: ew-resize;
        touch-action: none;
      }

      .before-after-compare:focus-visible {
        outline: 2px solid var(--soft-ink);
        outline-offset: 2px;
      }

      .compare-image {
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
      }

      .compare-base-image {
        position: relative;
        width: 100%;
        height: auto;
        display: block;
      }

      .compare-overlay-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        clip-path: inset(0 50% 0 0);
      }

      .compare-base-image.is-split {
        aspect-ratio: var(--compare-aspect, 3 / 2);
        background-image: var(--split-source);
        background-size: 100% 200%;
        background-position: center bottom;
        background-repeat: no-repeat;
      }

      .compare-overlay-image.is-split {
        background-image: var(--split-source);
        background-size: 100% 200%;
        background-position: center top;
        background-repeat: no-repeat;
      }

      .compare-divider {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 1px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 0 0 1px rgba(49, 63, 141, 0.08), 0 0 18px rgba(49, 63, 141, 0.18);
        transform: translateX(-50%);
      }

      .compare-handle {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 48px;
        height: 48px;
        border-radius: 999px;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(49, 63, 141, 0.12);
        color: var(--logo-ink);
        font-size: 1rem;
        font-weight: 700;
        box-shadow: 0 8px 24px rgba(49, 63, 141, 0.16);
      }

      .compare-label {
        position: absolute;
        top: 12px;
        z-index: 2;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(27, 42, 112, 0.78);
        color: #ffffff;
        font-size: 0.74rem;
        letter-spacing: 0.08em;
        font-weight: 700;
      }

      .compare-label-before {
        left: 12px;
      }

      .compare-label-after {
        right: 12px;
      }

      .before-after-compare.is-dragging .compare-handle {
        box-shadow: 0 0 0 4px rgba(103, 128, 245, 0.18);
      }

      .compare-label-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 8px 2px;
        color: rgba(31, 45, 102, 0.64);
        font-family: "Nunito Sans", sans-serif;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.16em;
      }

      .compare-zoom {
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0;
        background: rgba(255, 255, 255, 0.72);
        color: var(--logo-ink);
        cursor: pointer;
        transition: transform 180ms ease, background 180ms ease;
      }

      .compare-zoom:hover {
        transform: scale(1.06);
        background: #ffffff;
      }

      .compare-zoom svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.1;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .case-card-compare:fullscreen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        width: 100vw;
        height: 100vh;
        padding: 18px;
        overflow: auto;
        border-radius: 0;
        background: #f8faff;
      }

      .case-card-compare.compare-zoom-fallback {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        width: 100vw;
        height: 100vh;
        max-width: none;
        padding: 18px;
        overflow: auto;
        border-radius: 0;
        background: #f8faff;
      }

      .case-card-compare.is-zooming:fullscreen .before-after-compare,
      .case-card-compare.is-zooming.compare-zoom-fallback .before-after-compare {
        flex: 0 0 auto;
        width: min(86vw, 860px);
        max-width: none;
        max-height: none;
        transform: scale(2);
        transform-origin: center;
      }

      .case-card-compare.is-zooming.compare-zoom-fallback.compare-mobile-zoom .before-after-compare {
        width: min(76dvh, 860px);
        margin-top: calc(24dvh + 72px);
        transform: rotate(90deg) scale(1.18);
      }

      .case-card-compare.compare-zoom-fallback.compare-mobile-zoom {
        justify-content: flex-start;
        height: 100dvh;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 72px 18px 36px;
      }

      .case-card-compare.is-zooming:fullscreen .compare-label-row,
      .case-card-compare.is-zooming.compare-zoom-fallback .compare-label-row {
        position: fixed;
        top: 14px;
        left: 50%;
        z-index: 3;
        width: min(420px, calc(100vw - 28px));
        padding: 8px 12px;
        border: 1px solid rgba(49, 63, 141, 0.14);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.94);
        transform: translateX(-50%);
      }

      .case-card-compare.is-zooming.compare-zoom-fallback.compare-mobile-zoom .compare-label-row {
        top: 50%;
        left: 30px;
        width: min(420px, calc(100dvh - 28px));
        transform: translate(-50%, -50%) rotate(90deg);
      }

      .case-card-compare.is-zooming:fullscreen .case-caption,
      .case-card-compare.is-zooming.compare-zoom-fallback .case-caption {
        display: none;
      }

      body.compare-zoom-open {
        overflow: hidden;
      }

      .case-caption {
        margin: 0;
        padding: 18px 20px 20px;
        border-top: 1px solid var(--line);
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 10px 28px;
        color: rgba(31, 45, 102, 0.78);
        font-family: "Nunito Sans", "Paperlogy", sans-serif;
        font-size: 0.88rem;
        font-weight: 600;
        line-height: 1.8;
        letter-spacing: 0.015em;
        text-align: left;
        word-break: keep-all;
      }

      .case-caption::before {
        content: "CASE 0" counter(case);
        display: block;
        grid-column: 1 / -1;
        margin-bottom: 7px;
        color: var(--accent);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.18em;
      }

      .case-details {
        min-width: 0;
      }

      .case-price {
        display: grid;
        justify-items: end;
        min-width: 154px;
        padding-left: 28px;
        border-left: 1px solid var(--line);
        line-height: 1.35;
        text-align: right;
      }

      .case-price-label {
        margin-bottom: 4px;
        color: var(--soft-ink);
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .case-price-krw {
        color: var(--ink);
        font-size: 1.04rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .case-price-usd {
        color: rgba(31, 45, 102, 0.58);
        font-size: 0.75rem;
        font-weight: 600;
      }

      .bottom-cta {
        margin-top: 50px;
        display: flex;
        justify-content: center;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 156px;
        min-height: 52px;
        padding: 15px 26px;
        border: 1px solid rgba(49, 63, 141, 0.08);
        border-radius: 999px;
        color: var(--logo-ink);
        background: rgba(205, 215, 255, 0.9);
        box-shadow: 0 14px 32px rgba(31, 45, 102, 0.12);
        font-family: "Paperlogy", "Nunito Sans", "Segoe UI", sans-serif;
        font-size: 1rem;
        font-weight: 600;
        line-height: 1;
        text-decoration: none;
        transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
      }

      .btn:hover {
        transform: translateY(-2px);
        background: #bdcaff;
        box-shadow: 0 18px 38px rgba(31, 45, 102, 0.16);
      }

      .sticky-appointment {
        position: fixed;
        right: 28px;
        bottom: 28px;
        z-index: 20;
        white-space: nowrap;
      }

      @media (max-width: 640px) {
        .sticky-appointment {
          right: 18px;
          bottom: 18px;
          left: 18px;
        }
      }

      @media (max-width: 820px) {
        .case-card-featured {
          width: 100%;
          margin: 0 auto;
          grid-template-columns: 1fr;
        }

        .case-card-compare {
          width: 100%;
        }

        .case-card-featured img {
          height: auto;
        }

        .case-caption {
          text-align: left;
        }
      }

      @media (max-width: 640px) {
        .page {
          width: min(560px, 92vw);
          padding-top: 20px;
        }

        .logo-img {
          max-width: min(162px, 78vw);
        }

        .case-card {
          width: 100%;
          border-radius: 20px;
        }

        .case-card-compare {
          padding: 6px;
        }

        .before-after-compare {
          border-radius: 15px;
        }

        .page-intro {
          margin-bottom: 30px;
        }

        .case-caption {
          padding: 15px 14px 16px;
          font-size: 0.8rem;
          text-align: left;
        }

        .case-price {
          min-width: 128px;
          padding-left: 16px;
        }

        .case-price-krw {
          font-size: 0.92rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a class="logo-link" href="/english" aria-label="lofi esthetic dentistry English home">
          <img src="assets/영문로고.png" alt="lofi esthetic dentistry" class="logo-img" />
        </a>
        <nav class="nav-back">
          <a href="/english" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 18 9 12l6-6" />
            </svg>
          </a>
        </nav>
      </header>

      <main>
        <section class="page-intro" aria-labelledby="page-title">
          <h1 class="page-title" id="page-title">Designed to look naturally yours.</h1>
          <p class="page-description">Every treatment is shaped around facial balance and the character of each smile.</p>
        </section>
        <section class="case-grid" aria-label="Before and after">

              aria-label="Before and after veneer case 1 front, left side, and right side view comparison"
            >

              <img

                src="assets/before-after/case-01-before.png"

              />
              <div class="compare-divider" aria-hidden="true">

              </div>
            </div>
            <div class="compare-label-row"><span>BEFORE</span><button class="compare-zoom" type="button" aria-label="Zoom comparison 200%"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button><span>AFTER</span></div>
            <figcaption class="case-caption">
              <span class="case-details">Material: Composite<br />Shade: A1</span>

          </figure>
          <figure class="case-card case-card-compare">
            <div
              class="before-after-compare"
              tabindex="0"
              data-start="50"
              aria-label="Before and after veneer case 2 front, left side, and right side view comparison"
            >
              <img
                class="compare-image compare-base-image"
                src="assets/before-after/case-02-after.png"
                alt="Veneer after front, left side, and right side view image"
              />
              <img
                class="compare-image compare-overlay-image"
                src="assets/before-after/case-02-before.png"
                alt="Veneer before front, left side, and right side view image"
              />
              <div class="compare-divider" aria-hidden="true">
                <span class="compare-handle">↔</span>
              </div>
            </div>
            <div class="compare-label-row"><span>BEFORE</span><button class="compare-zoom" type="button" aria-label="Zoom comparison 200%"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button><span>AFTER</span></div>
            <figcaption class="case-caption">
              <span class="case-details">Material: Porcelain(Rosetta)<br />Shade: A1</span>
              <span class="case-price" aria-label="259,000 Korean won per tooth, approximately 192 US dollars">
                <span class="case-price-label">Per tooth</span>
                <strong class="case-price-krw">₩259,000</strong>
                <span class="case-price-usd">≈ $192 USD</span>
              </span>
            </figcaption>
          </figure>
          <figure class="case-card case-card-compare">
            <div
              class="before-after-compare"
              tabindex="0"
              data-start="50"
              aria-label="Before and after veneer case 3 front and right side view comparison"
            >
              <img
                class="compare-image compare-base-image"
                src="assets/before-after/case-03-after.jpg"
                alt="Veneer after front and right side view image"
              />
              <img
                class="compare-image compare-overlay-image"
                src="assets/before-after/case-03-before.jpg"
                alt="Veneer before front and right side view image"
              />
              <div class="compare-divider" aria-hidden="true">
                <span class="compare-handle">↔</span>
              </div>
            </div>
            <div class="compare-label-row"><span>BEFORE</span><button class="compare-zoom" type="button" aria-label="Zoom comparison 200%"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button><span>AFTER</span></div>
            <figcaption class="case-caption">
              <span class="case-details">Material: Porcelain(Emax)<br />Shade: A1</span>
              <span class="case-price" aria-label="399,000 Korean won per tooth, approximately 296 US dollars">
                <span class="case-price-label">Per tooth</span>

        </section>
        <div class="bottom-cta">
          <a class="btn sticky-appointment" href="/reservation/index.html">Book your appointment</a>
        </div>
      </main>
    </div>
    <script>
      (function () {
        const components = document.querySelectorAll(".before-after-compare");

        const getClientX = (event) => {
          if (event.touches && event.touches.length > 0) return event.touches[0].clientX;
          if (event.changedTouches && event.changedTouches.length > 0) return event.changedTouches[0].clientX;
          return event.clientX;
        };

        const getClientY = (event) => {
          if (event.touches && event.touches.length > 0) return event.touches[0].clientY;
          if (event.changedTouches && event.changedTouches.length > 0) return event.changedTouches[0].clientY;
          return event.clientY;
        };

        components.forEach((compare) => {
          const card = compare.closest(".case-card-compare");
          const zoomButton = card?.querySelector(".compare-zoom");
          const overlayImage = compare.querySelector(".compare-overlay-image");
          const divider = compare.querySelector(".compare-divider");
          let isDragging = false;

          const shouldLockLandscape = () => window.matchMedia("(max-width: 820px)").matches || (window.matchMedia("(pointer: coarse)").matches && window.innerWidth < 1200);
          const shouldUseMobileZoom = shouldLockLandscape;

          const unlockOrientation = () => {
            try { screen.orientation?.unlock?.(); } catch {}
          };

          const closeZoomFallback = () => {
            card?.classList.remove("is-zooming", "compare-zoom-fallback", "compare-mobile-zoom");
            document.body.classList.remove("compare-zoom-open");
            unlockOrientation();
          };

          const openZoomFallback = (mobileZoom = false) => {
            card?.classList.add("is-zooming", "compare-zoom-fallback");
            card?.classList.toggle("compare-mobile-zoom", mobileZoom);
            document.body.classList.add("compare-zoom-open");
          };

          document.addEventListener("fullscreenchange", () => {
            if (document.fullscreenElement === card) return;
            closeZoomFallback();
          });

          const setSplit = (event) => {
            const rect = compare.getBoundingClientRect();
            const useVerticalSplit = card?.classList.contains("compare-mobile-zoom");
            const size = useVerticalSplit ? rect.height : rect.width;
            if (!size) return;
            const position = useVerticalSplit ? getClientY(event) - rect.top : getClientX(event) - rect.left;
            const ratio = position / size;
            const clamped = Math.min(1, Math.max(0, ratio));
            const percent = clamped * 100;
            overlayImage.style.clipPath = `inset(0 ${100 - percent}% 0 0)`;
            divider.style.left = `${percent}%`;
          };

          const initial = Number(compare.dataset.start);
          const startPercent = Number.isFinite(initial) ? Math.min(100, Math.max(0, initial)) : 50;
          overlayImage.style.clipPath = `inset(0 ${100 - startPercent}% 0 0)`;
          divider.style.left = `${startPercent}%`;

          compare.addEventListener("mousedown", (event) => {
            isDragging = true;
            compare.classList.add("is-dragging");
            setSplit(event);
          });

          window.addEventListener("mousemove", (event) => {
            if (!isDragging) return;
            setSplit(event);
          });

          window.addEventListener("mouseup", () => {
            if (!isDragging) return;
            isDragging = false;
            compare.classList.remove("is-dragging");
          });

          compare.addEventListener("touchstart", (event) => {
            isDragging = true;
            compare.classList.add("is-dragging");
            setSplit(event);
          }, { passive: true });

          compare.addEventListener("touchmove", (event) => {
            if (!isDragging) return;
            event.preventDefault();
            setSplit(event);
          }, { passive: false });

          compare.addEventListener("touchend", () => {
            if (!isDragging) return;
            isDragging = false;
            compare.classList.remove("is-dragging");
          });

          compare.addEventListener("keydown", (event) => {
            if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
            event.preventDefault();
            const currentInset = Number((overlayImage.style.clipPath.match(/inset\(0\s+([0-9.]+)%/) || [])[1]);
            const current = Number.isFinite(currentInset) ? 100 - currentInset : 50;
            const next = event.key === "ArrowLeft" ? current - 3 : current + 3;
            const clamped = Math.min(100, Math.max(0, next));
            overlayImage.style.clipPath = `inset(0 ${100 - clamped}% 0 0)`;
            divider.style.left = `${clamped}%`;
          });

          zoomButton?.addEventListener("click", async () => {
            if (card?.classList.contains("compare-zoom-fallback")) {
              closeZoomFallback();
              return;
            }
            if (document.fullscreenElement === card) {
              await document.exitFullscreen?.();
              return;
            }
            if (shouldUseMobileZoom()) {
              openZoomFallback(true);
              return;
            }
            if (!card?.requestFullscreen) {
              openZoomFallback();
              return;
            }
            if (document.fullscreenElement) await document.exitFullscreen?.();
            card.classList.add("is-zooming");
            try {
              await card.requestFullscreen();
              if (shouldLockLandscape()) await screen.orientation?.lock?.("landscape").catch(() => {});
            } catch {
              openZoomFallback();
            }
          });
        });
      })();
    </script>
    <script src="/assets/consult-chat.js" defer></script>
  </body>
</html>
