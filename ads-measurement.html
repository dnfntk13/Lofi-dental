  <title>Lofi advertising measurement</title>

<body>
<script>
(function () {
  'use strict';
  if (window.parent === window) return;
  var origins = ['https://lofiesthetic.com', 'https://www.lofiesthetic.com'];
  var active = false, loaded = false, completed = new Set(), parentOrigin = '';

    'lofi:whatsapp-channel-click': 'AW-18223406681/VlJ6CPr1kKQdENm8zPFD'
  };
  window.dataLayer = [];
  function gtag() { window.dataLayer.push(arguments); }
  window.addEventListener('message', function (event) {
    if (event.source !== window.parent || !origins.includes(event.origin)) return;

      active = true; parentOrigin = event.origin;

      gtag('set', 'allow_ad_personalization_signals', false);
      gtag('set', 'url_passthrough', false);
      gtag('js', new Date());

        send_page_view: false, allow_google_signals: false,

        page_referrer: '', page_title: 'Lofi advertising measurement'

      script.async = true; script.referrerPolicy = 'no-referrer';
      script.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18223406681';
      script.onload = function () {
        loaded = true;
        window.parent.postMessage({ type: 'lofi:measurement-ready' }, parentOrigin);
      };
      script.onerror = function () { window.parent.postMessage({ type: 'lofi:measurement-failed' }, parentOrigin); };
      document.head.appendChild(script);
    } else if (Object.hasOwn(destinations, event.data?.type) && loaded && !completed.has(event.data.type)) {

        send_to: destinations[eventType],

})();
</script>
