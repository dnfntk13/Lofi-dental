<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/assets/visitor-attribution.js" defer></script>
    <title>WhatsApp | lofi esthetic dentistry</title>
    <style>
      :root {
        --bg-cream: #fbfaff;
        --bg-mist: #f0edfb;
        --ink: #3b2b78;
        --soft-ink: #7968bb;
        --line: rgba(137, 117, 213, 0.22);
        --card: rgba(255, 255, 255, 0.95);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 112px 24px 24px;
        font-family: "Nunito Sans", "Segoe UI", "Helvetica Neue", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(137, 117, 213, 0.14), transparent 28%),
          radial-gradient(circle at top right, rgba(103, 128, 245, 0.18), transparent 30%),
          linear-gradient(180deg, #f8faff 0%, var(--bg-cream) 48%, var(--bg-mist) 100%);
      }

      .site-logo {
        position: absolute;
        top: 22px;
        left: 22px;
        display: inline-block;
        line-height: 0;
      }

      .site-logo img {
        width: min(180px, 50vw);
        max-height: 72px;
        height: auto;
        display: block;
        object-fit: contain;
      }

      .card {
        width: min(520px, 100%);
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--card);
        padding: 28px;
        text-align: center;
      }

      h1 { margin: 0; font-size: 1.6rem; }
      p { margin: 12px 0 0; color: var(--soft-ink); line-height: 1.7; }
      a {
        display: inline-block;
        margin-top: 18px;
        padding: 12px 18px;
        border-radius: 999px;
        border: 1px solid var(--line);
        text-decoration: none;
        color: var(--ink);
        font-weight: 700;
        background: #ffffff;
      }

      @media (max-width: 760px) {
        body { padding: 96px 18px 18px; }
        .site-logo { top: 18px; left: 14px; }
        .site-logo img { width: min(160px, 52vw); max-height: 62px; }
      }
    </style>
  </head>
  <body>
    <a class="site-logo" href="/english" aria-label="lofi esthetic dentistry English home">
          <img src="../assets/lofi-logo-violet.png" alt="lofi esthetic dentistry" />
    </a>
    <main class="card">
      <h1>WhatsApp</h1>
      <p>Continue to our WhatsApp when you are ready.</p>
      <a href="https://whatsapp.com/channel/0029VbDaNE5It5roZdu5et3g">Go to WhatsApp</a>
    </main>
  </body>
</html>
