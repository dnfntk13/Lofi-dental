<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lofi DM Importer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <h1>Lofi DM Importer</h1>
      <p class="status" id="status">Open Instagram Direct, then let the importer read and save visible DM threads.</p>
      <label class="field">
        <span>Server URL</span>
        <input id="serverUrl" type="url" spellcheck="false" />
      </label>
      <label class="field">
        <span>Import token</span>
        <input id="importToken" type="password" spellcheck="false" />
      </label>
      <label class="toggle">
        <input id="autoSave" type="checkbox" />
        <span>Auto-save current DM thread</span>
      </label>
      <label class="toggle">
        <input id="autoScanDms" type="checkbox" />
        <span>Auto-scan DM list after login</span>
      </label>
      <div class="controls">
        <button id="saveSettings" type="button">Save settings</button>
        <button id="openInstagram" type="button">Open Instagram DM</button>
        <button id="testServer" type="button">Test server save</button>
        <button id="saveCurrentDm" type="button">Save open DM now</button>
        <button id="scanDms" class="primary" type="button">Read each DM & save</button>
      </div>
      <p class="note">The importer uses your already logged-in Instagram tab. It saves scanned DM conversations to Patients so Admin AI can check them one by one.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
