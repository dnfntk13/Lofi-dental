<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lofi DM Importer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <h1>Lofi DM Importer</h1>
      <p class="status" id="status">Open Instagram Direct. The reader saves visible DM threads so Admin AI can read them.</p>
      <label class="field">
        <span>Server URL</span>
        <input id="serverUrl" type="url" spellcheck="false" />
      </label>
      <label class="field">
        <span>Import token</span>
        <input id="importToken" type="password" spellcheck="false" />
      </label>
      <label class="toggle">
        <input id="autoSave" type="checkbox" />
        <span>Let Admin AI read the open DM thread automatically</span>
      </label>
      <label class="toggle">
        <input id="autoScanDms" type="checkbox" />
        <span>Let Admin AI read the DM list automatically</span>
      </label>
      <div class="controls">
        <button id="saveSettings" type="button">Save settings</button>
        <button id="openInstagram" type="button">Open Instagram DM</button>
        <button id="testServer" type="button">Test server save</button>
        <button id="saveCurrentDm" type="button">Save open DM now</button>
        <button id="aiReadScreen" type="button">AI read visible screen</button>
        <button id="sync3Days" class="primary" type="button">3일치 스캔</button>
        <button id="sync7Days" class="primary" type="button">일주일치 스캔</button>
      </div>
      <p class="note">The reader uses your already logged-in Instagram tab. It saves recent DM conversations to Patients so Admin AI can check them one by one.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
